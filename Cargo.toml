[package]
name = "sharkreader"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
iced = { version = "0.14.0", features = ["tokio", "image", "webgl", "fira-sans"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Request", "RequestInit", "RequestMode", "Response", "Window", "console"] }
js-sys = "0.3"
